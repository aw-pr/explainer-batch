<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 4: </span>Comparison of PIC Algorithms. The area above the dashed line corresponds to the compile step, while the area below corresponds to the link step. <span id="S4.F4.6" class="ltx_text ltx_font_typewriter">KVLink</span> recomputes a subset of tokens, highlighted in dark colors. Four algorithms include <span id="S4.F4.7" class="ltx_text ltx_font_italic">Naive</span>, <span id="S4.F4.8" class="ltx_text ltx_font_italic">Fully Recompute (FR)</span>, CacheBlend, and <span id="S4.F4.9" class="ltx_text ltx_font_italic">LegoLink</span>. The bottom right visualizes attention maps (layer 5, head 5 of Llama 3.1 8B) for four decoded tokens. The x-axis marks the position ID of the first token of each chunk. To highlight the differences between attention maps, we normalize the <math id="S4.F4.m2" class="ltx_Math" alttext="QK^{T}" display="inline" intent=":literal"><semantics><mrow><mi>Q</mi><mo lspace="0em" rspace="0em">​</mo><msup><mi>K</mi><mi>T</mi></msup></mrow><annotation encoding="application/x-tex">QK^{T}</annotation></semantics></math> results to the [0, 1] range using min-max scaling instead of Softmax.</figcaption>
