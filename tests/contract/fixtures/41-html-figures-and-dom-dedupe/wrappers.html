<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic wrappers, no figure element</title></head>
<body>
<!-- Synthetic: a page with no figure element. Only whole class tokens chart, figure, graph or plot make a wrapper a candidate. -->
<div class="typography-body"><img src="/a/typo.png" alt=""></div>
<div class="paragraph"><img src="/a/para.png" alt=""></div>
<div class="prefigured"><img src="/a/prefig.png" alt=""></div>
<div class="results chart-wrap"><img src="/a/chart.png" alt="A chart"></div>
<section class="Plot"><img src="/a/plot.png" alt=""></section>
<span class="inline-figure"><img src="/a/fig.png" alt=""></span>
</body>
</html>
